<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Praktikum Mandiri - Pengolah Nilai Mahasiswa</title>
</head>
<body>
  <h2>Praktikum Mandiri: Pengolah Nilai Mahasiswa</h2>
  

  <script>
    // 1. Deklarasi variabel nama dan nilai 
    const namaMahasiswa = "Raisa Aliyah";
    const nilaiTugas = 80;
    const nilaiUTS = 85;
    const nilaiUAS = 92;

    // 2. Perhitungan nilai akhir (Tugas 30% + UTS 30% + UAS 40%)
    const nilaiAkhir = (nilaiTugas * 0.30) + (nilaiUTS * 0.30) + (nilaiUAS * 0.40);

    // 3. Percabangan untuk menentukan status kelulusan
    let statusKelulusan;
    if (nilaiAkhir >= 60) {
      statusKelulusan = "LULUS";
    } else {
      statusKelulusan = "TIDAK LULUS";
    }

    // 4. Menampilkan output wajib melalui console.log()
    console.log("Nama Mahasiswa   :", namaMahasiswa);
    console.log("Nilai Akhir      :", nilaiAkhir);
    console.log("Status Kelulusan :", statusKelulusan);
  </script>
</body>
</html>
